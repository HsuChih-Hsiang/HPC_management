# ============================================================
# WAF → nginx → gunicorn
#
# 對外的 TLS 由 WAF 終結，這裡的 443 只是給 WAF 回源用的自簽憑證，
# 因此不做 HTTP → HTTPS 轉址：WAF 用 80 或 443 回源都要能正常服務，
# 硬轉址只會在「WAF 走 http 回源」時打成無窮迴圈。
#
# server_name 用 _（catch-all）而不是 ${DOMAIN}：這台 nginx 前面只有 WAF，
# 不需要靠 Host 分流，少一個 envsubst 就少一處部署會壞掉的地方。
# ============================================================

# 保留 WAF 已經帶進來的協定資訊；WAF 沒帶時才退回 nginx 自己看到的 scheme。
# 少了這段，Flask 會以為請求是 http，url_for(_external=True) 產出的
# Google OAuth redirect_uri 就會對不上後台註冊的 https 網址。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream app_backend {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 寄送郵件會夾帶報價單 PDF 與附件，預設的 1m 太小
    client_max_body_size 32m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # 給 WAF / 監控用的健康檢查：不進 Flask，也不寫 access log
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        # 產生報價單 PDF 時 Chromium 排版要跑一陣子，
        # 這裡要留得比 gunicorn 的 --timeout 120 寬一點，
        # 否則會變成 nginx 先回 504，看不到後端真正的錯誤。
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }
}
